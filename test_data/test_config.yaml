spacemake_version: 0.9.5
root_dir: '.'
temp_dir: '/tmp'
external_bin: 
        dropseq_tools: '/data/rajewsky/shared_bins/Drop-seq_tools-2.5.1/'
logging:
  level: INFO
  debug: "spacemake.util.read_fq"

puck_data:
    barcode_file: 'predictions_ml.csv'
    root: 'puck_data'

pucks:
    default:
        width_um: 3000
        spot_diameter_um: 10
    visium:
        barcodes: 'puck_data/visium_barcode_positions.csv'
        width_um: 6500
        spot_diameter_um: 55
    seq_scope:
        width_um: 1000
        spot_diameter_um: 1
    slide_seq:
        width_um: 3000
        spot_diameter_um: 10
    test_puck:
        width_um: 4000
        spot_diameter_um: 1 
    openst:
        width_um: 1200
        spot_diameter_um: 0.6
        coordinate_system: 'puck_data/openst_coordinate_system.csv'

run_modes:
    default:
        n_beads: 100000
        umi_cutoff: [100, 300, 500] # < remove
        clean_dge: False
        detect_tissue: False
        count_intronic_reads: True
        count_mm_reads: False
        mesh_data: False
        mesh_type: 'circle'
        mesh_spot_diameter_um: 55
        mesh_spot_distance_um: 100
    visium:
        n_beads: 10000
        umi_cutoff: [1000]
        clean_dge: False # < remove
        detect_tissue: True
        count_intronic_reads: False # < goes to quant.py
        count_mm_reads: True # < goes to quant.py
    slide_seq:
        n_beads: 100000
        umi_cutoff: [50]
        clean_dge: False
        detect_tissue: False
    scRNA_seq:
        n_beads: 10000
        umi_cutoff: [500]
        detect_tissue: False
        count_intronic_reads: True
        count_mm_reads: False
    seq_scope:
        clean_dge: false
        count_intronic_reads: false
        count_mm_reads: false
        detect_tissue: false
        mesh_data: true
        mesh_spot_diameter_um: 10
        mesh_spot_distance_um: 15
        mesh_type: hexagon
        n_beads: 1000
        umi_cutoff:
        - 100
        - 300
    spatial_rm:
        clean_dge: false
        count_intronic_reads: false
        count_mm_reads: false
        detect_tissue: false
        mesh_data: true
        mesh_spot_diameter_um: 10
        mesh_spot_distance_um: 15
        mesh_type: hexagon
        n_beads: 1000
        umi_cutoff:
        - 500
        - 1000
    openst:
        clean_dge: false
        count_intronic_reads: true
        count_mm_reads: true
        detect_tissue: false
        mesh_data: true
        mesh_spot_diameter_um: 7
        mesh_spot_distance_um: 7
        mesh_type: hexagon
        n_beads: 100000
        polyA_adapter_trimming: true
        spatial_barcode_min_matches: 0.1
        umi_cutoff:
        - 100
        - 250
        - 500
    openst_nomesh:
        clean_dge: false
        count_intronic_reads: true
        count_mm_reads: true
        detect_tissue: false
        mesh_data: false
        n_beads: 100000
        polyA_adapter_trimming: true
        spatial_barcode_min_matches: 0.1
        umi_cutoff:
        - 100
        - 250
        - 500

adapter_flavors:
    default:
        - quality:
            right: 25
        - polyA:
        - adapter:
            name: SMART
            seq: AAGCAGTGGTATCAACGCAGAGTGAATGGG
            min_overlap: 10
            max_errors: 0.1
        - barcode:
            cell: "r1[0:12]"
            UMI: "r1[12:20]"
    openst:
        - quality:
            right: 25
        - polyA:
        - adapter:
            name: SMART
            seq: AAGCAGTGGTATCAACGCAGAGTGAATGGG
            min_overlap: 10
            max_errors: 0.1
        - barcode:
            UMI: "r2[0:9]"
            cell: "r1[2:27]"
        - clip:
            left: 12

    dropseq:
        - quality:
            right: 25
        - polyA:
        - adapter:
            name: SMART
            seq: AAGCAGTGGTATCAACGCAGAGTGAATGGG
            min_overlap: 10
            max_errors: 0.1
        - barcode:
            cell: "r1[0:12]"
            UMI: "r1[12:20]"


barcode_flavors:
    default:
        cell: "r1[0:12]"
        UMI: "r1[12:20]"
    dropseq:
        cell: "r1[0:12]"
        UMI: "r1[12:20]"
    slide_seq_14bc:
        cell: "r1[0:14]"
        UMI: "r1[14:23]"
    slide_seq_15bc:
        cell: "r1[0:14]"
        UMI: "r1[15:23]"
    visium:
        cell: "r1[0:16]"
        UMI: "r1[16:28]"
    sc_10x_v2:
        cell: "r1[0:16]"
        UMI: "r1[16:26]"
    seq_scope:
        UMI: "r2[0:9]"
        cell: "r1[0:20]"
    nextflex:
        min_qual_trim: 20
        cell: "'A'"
        read1: "None"
        UMI: "r2[:4] + r2[-4:]"
        seq: "r2[4:-4]"
        qual: "r2_qual[4:-4]"


adapters:
    optical_primer: GAATCACGATACGTACACCA
    TSO_SMART: AAGCAGTGGTATCAACGCAGAGTGAATGGG
    SMART: AAGCAGTGGTATCAACGCAGAGTG
    smart: AATGATACGGCGACCACCGAGATCTACACTCTTTCCCTACACGACGCTCTTC
    TSO_10x: AAGCAGTGGTATCAACGCAGAGTACATGGG
    chromium_bead: CTACACGACGCTCTTCCGATCT
    dropseq_bead: AAGCAGTGGTATCAACGCAGAGTAC
    polyA: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    polyG: GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG
    nextflex_RA3: TGGAATTCTCGGGTGCCAAGGAACTCCAGTCACTGACCAATCTCGTATGCCGTCTTCTGCTTGAA
    truseq_RA3: TGGAATTCTCGGGTGCCAAGGAACTCCAGTCACCCGTCCA

quant:
  default:
    counter_class: "spacemake.quant.DefaultCounter"
    channels: 
      - "counts"
      - "exonic_counts"
      - "exonic_reads"
      - "intronic_counts"
      - "intronic_reads"
    X_counts: ["exonic_counts", "intronic_counts"]
    alignment_priorities: {
        'C': 101, # coding exon
        'c': 100, # coding exon (lower case == antisense)
        'U': 51,  # UTR exon
        'u': 50,
        'CU': 51, # overlaps both, CDS+UTR (should in fact never occur as 'CU')
        'cu': 50,
        'N': 21, # exon of non-coding transcript
        'n': 20,
        'I': 11, # intronic region
        'i': 10,
        '-': 0,
    }
    gene_priorities: {
        'C': 101, # coding exon
        'c': 100, # coding exon (lower case == antisense)
        'U': 51,  # UTR exon
        'u': 50,
        'CU': 51, # overlaps both, CDS+UTR (should in fact never occur as 'CU')
        'cu': 50,
        'N': 21, # exon of non-coding transcript
        'n': 20,
        'I': 11, # intronic region
        'i': 10,
        '-': 0,
    }
    exonic_tags: ["C", "U", "CU", "N", "c", "u", "cu", "n"]
    intronic_tags: ["I", "i"]
    alignment_selection: priority
    exon_intron_disambiguation: "exon_wins"
  miRNA:
    alignment_selection: take_first
  chrom:
    alignment_selection: take_first    
    gene_selection: chrom
  custom_index:
    alignment_selection: take_first_plus
    gene_selection: chrom
species:
    test_hsa:
        genome:
            annotation: "{spacemake_dir}/test_data/simple_annotation.gtf"
            sequence: "{spacemake_dir}/test_data/simple_genome.fa"
        miRNA:
            annotation: "{spacemake_dir}/test_data/mirgenedb.hsa.mature.gtf.gz"
            sequence: "{spacemake_dir}/test_data/mirgenedb.hsa.mature.fa.gz"
        rRNA:
            annotation: ''
            sequence: "{spacemake_dir}/test_data/rRNA_hsa.fa.gz"

default_mapper_settings:
    STAR:
        index_flags: --genomeSAindexNbases 12

        map_flags: >-
            --limitBAMsortRAM 5000000000
            --outSAMprimaryFlag AllBestScore
            --outSAMattributes Standard
            --outSAMunmapped Within
            --outStd BAM_Unsorted
            --outSAMtype BAM Unsorted
            --limitOutSJcollapsed 5000000

    bowtie2:
        index_flags: >-
            --ftabchars 12
            --offrate 1
        
        # --score-min=L,0,1.5 -> require 75% of perfect match (2=base match)
        map_flags: >-
            --local
            -L 10 -D 30 -R 30
            -k 10
            --ignore-quals
            --score-min=L,0,1.5



paths:
    base:
        project_dir : "projects/{project_id}"
        config_path : "config.yaml"
        project_df : "project_df.csv"
        raw_data_root: "projects/{project_id}/raw_data"
        raw_data_illumina: "projects/{project_id}/raw_data/illumina"
        raw_data_illumina_reads: "projects/{project_id}/raw_data/illumina/reads/raw"
        raw_data_illumina_reads_reversed: "projects/{project_id}/raw_data/illumina/reads/bc_umi_tagged"
        processed_data_root: "projects/{project_id}/processed_data/{sample_id}"
        processed_data_illumina: "projects/{project_id}/processed_data/{sample_id}/illumina"
        illumina_root: "projects/{project_id}/processed_data/{sample_id}/illumina"
    downsampled_data:
#        prefix: "projects/{project_id}/processed_data/{sample_id}/illumina/downsampled_data"
        root: "projects/{project_id}/processed_data/{sample_id}/illumina/downsampled_data/{downsampling_percentage}"
    complete_data:
        root: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data"
        log_dir: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/logs"
        stats: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/stats"
        plots: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/plots"
    data_root: "projects/{project_id}/processed_data/{sample_id}/illumina/{data_root_type}{downsampling_percentage}"
    bam:
        linked: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/{link_name}.cram"
        mapped: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/{ref_name}.{mapper}.cram"
        unmapped: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/not_{ref_name}.{mapper}.cram"
        star_mapped: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/{ref_name}.STAR.cram"
        star_unmapped: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/not_{ref_name}.STAR.cram"
        bt2_mapped: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/{ref_name}.bowtie2.cram"
        bt2_unmapped: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/not_{ref_name}.bowtie2.cram"
        bt2_mapped_log: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/{ref_name}.bowtie2.log"
        # special log file used for rRNA "ribo depletion" stats
        bt2_rRNA_log: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/rRNA.bowtie2.cram.log"
        # special flag to indicate that intermediate non_...cram files have been removed
        unmapped_removed_flag: "projects/{project_id}/processed_data/{sample_id}/illumina/complete_data/.unmapped_removed"







